name: Feature request
description: Propose a reusable workflow, rule, script, or validation improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the real workflow problem, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing projects or alternatives reviewed
      description: Include links, licenses, maintenance status, risks, and adaptation cost.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How should this be tested?
    validations:
      required: true

